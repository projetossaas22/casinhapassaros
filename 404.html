<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>+100 Moldes de Casinhas para Pássaros</title>
  <script>
    // GitHub Pages SPA redirect
    // Redireciona 404s de volta para index.html preservando o path
    var segmentCount = 1; // número de segmentos do repositório (casinhapassaros = 1)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
